version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: calorie_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: calorie_tracker
    ports:
      - "5433:5432"
    volumes:
      - calorie_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: calorie_tracker_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: calorie_tracker_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  calorie_postgres_data:
  minio_data:
