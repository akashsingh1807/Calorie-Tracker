name: CI/CD Pipeline to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-test-and-deploy:
    name: Build, Test, and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Run Unit Tests
      - name: Run Maven Tests
        working-directory: ./backend
        run: ./mvnw clean test

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 3. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Configure Docker for Google Container Registry
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 5. Build Docker Image
      - name: Build Docker Image
        working-directory: ./backend
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend .

      # 6. Push Docker Image
      - name: Push Docker Image
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend

      # 7. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: calorie-tracker-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/calorie-tracker-backend
          region: us-central1
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
